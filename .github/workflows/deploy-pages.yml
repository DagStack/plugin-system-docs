name: Deploy to GitHub Pages

# Workflow активируется после mirror'а из Gitea на github.com/dagstack/plugin-system-docs.
# Пока репо живёт в Gitea — файл присутствует, но GitHub Actions не запускает его
# (GitHub не видит репо). После mirror + включения GitHub Pages в settings репо —
# автоматический deploy на push в main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate context7.json
        run: python3 -c "import json; data=json.load(open('context7.json')); print(f'context7.json valid, rules: {len(data[\"rules\"])}')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
